# For a list of settings you can customize, see
# http://displaytag.sourceforge.net/configuration.html

basic.empty.showtable=true
paging.banner.onepage=

paging.banner.group_size=5
paging.banner.one_item_found=<br/><div class="col-sm-6 infoBar align-left" style="margin-bottom: 20px;"><div class="infos">1 {0} found.</div></div>
paging.banner.all_items_found=<br/><div class="col-sm-6 infoBar align-left" style="margin-bottom: 20px;"><div class="infos">{0} {1} found.</div></div>


# messages

basic.msg.empty_list=No records found.
basic.msg.empty_list_row=<tr class="empty"><td colspan="{0}" style="height: 20px;"></td></tr>
error.msg.invalid_page=invalid page

export.amount=list
export.pdf=false
export.excel=true
export.csv=false
export.xml=false
export.excel.class=com.javaweb.export.excel.view.ExcelHssfView
export.banner=<div class="exportlinks">Export options: {0}</div>
export.banner.sepchar= |

paging.banner.item_name=item
paging.banner.items_name= items

paging.banner.no_items_found=<br/><div class="ms-3 col-sm-5" role="status" aria-live="polite">No records found.</div>
paging.banner.some_items_found=<br/><div class="ms-3 col-sm-6 align-left"><div class="info-horizontal">{0} {1} found, displaying from {2} to {3}.</div></div>


paging.banner.full=<div class="ms-5 col-sm-6 align-right text-xs-right tableList px-1"><ul class="pagination"><li class="page-link previous"><a href="{1}">&laquo;</a></li><li class="page-link"><a href="{2}">&lsaquo;</a></li><li class="page-link">{0}</li><li class="page-link"><a href="{3}">&rsaquo;</a></li><li class="page-link next"><a href="{4}">&raquo;</a></li></ul></div>
paging.banner.first=<div class="ms-5 col-sm-6 align-right text-xs-right tableList px-1"><ul class="pagination"><li class="page-link previous disabled"><a>&laquo;</a></li><li class="page-link disabled"><a>&lsaquo;</a></li><li>{0}</li><li class="page-link"><a href="{3}">&rsaquo;</a></li><li class="page-link next"><a href="{4}">&raquo;</a></li></ul></div>
paging.banner.last=<div class="ms-5 col-sm-6 align-right text-xs-right tableList px-1"><ul class="pagination"><li class="page-link previous"><a href="{1}">&laquo;</a></li><li class="page-link"><a href="{2}">&lsaquo;</a></li><li class="page-link">{0}</li><li class="page-link disabled"><a >&rsaquo;</a></li><li class="page-link next disabled"><a>&raquo;</a></li></ul></div>
paging.banner.placement=bottom
paging.banner.page.selected=<li class="page-link active"><a>{0}</a></li>
paging.banner.page.link=<li class="page-link"><a href="{1}" title="Goto page {0}">{0}</a></li>
paging.banner.page.separator=

# external sort and pagination
pagination.sort.param=sort
pagination.sortdirection.param=dir
pagination.pagenumber.param=page
pagination.searchid.param=searchid
pagination.sort.asc.value=asc
pagination.sort.desc.value=desc
pagination.sort.skippagenumber=true
